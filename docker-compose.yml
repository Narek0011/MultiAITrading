services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiaitrading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/multiaitrading
    ports:
      - "3000:3000"
    volumes:
      - charts:/app/storage/charts

volumes:
  pgdata:
  charts:
